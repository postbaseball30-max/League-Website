ground:white;font-weight:700}.stat-box{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px}.stat-label{color:#64748b;font-size:13px}.stat-value{font-size:32px;font-weight:900}.back-btn{background:white;border:1px solid #cbd5e1;color:#334155;margin-bottom:16px}.card-img{width:100%;max-width:900px;display:block;margin:auto;border:2px solid #0f172a;border-radius:12px}.download-btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:#1d4ed8;color:white;text-decoration:none;font-weight:900;margin-top:14px}.mock-card{border:2px solid #0f172a;border-radius:12px;overflow:hidden;background:white}.mock-card-head{display:flex;justify-content:space-between;background:#f1f5f9;padding:16px;font-weight:900}.mock-card-grid{display:grid;grid-template-columns:repeat(6,1fr)}.mock-card-col{min-height:300px;padding:10px;border-right:1px solid #cbd5e1;font-size:13px;line-height:1.8}.left{background:#dbeafe}.right{background:#ffe4e6}
</style>

function findPlayer(n){return players.find(p=>p.player===n)||Object.values(rosters).flat().find(p=>p.player===n)||{player:n,team:'FA',position:'—',salary:'—'}}function findTeam(a){return teams.find(t=>t.team===a)||{team:a,name:a,wins:0,losses:0,pct:'.000',gb:'—',streak:'—'}}function findManager(n){let m=managers.find(x=>x.name===n)||managers[0];return {...m,...(managerDetails[m.name]||managerDetails['Mike Castagnaro'])}}
function b(txt,js,cls='link-btn'){return `<button class="${cls}" onclick="${js}">${txt}</button>`}function table(cols,rows){return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.r?c.r(r):(r[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function head(t,s,i){return `<div class="kicker">${i} League Hub</div><h1>${t}</h1><div class="subtitle">${s}</div>`}function setPage(p){state.page=p;state.player=state.team=state.manager=null;render()}function openPlayer(n){state.player=typeof n==='string'?findPlayer(n):n;state.team=state.manager=null;render()}function openTeam(a){state.team=findTeam(a);state.player=state.manager=null;render()}function openManager(n){state.manager=findManager(n);state.player=state.team=null;render()}
function renderNav(){nav.innerHTML=tabs.map(t=>`<button class="nav-btn ${state.page===t&&!state.player&&!state.team&&!state.manager?'active':''}" onclick="setPage('${t}')">${t}</button>`).join('')}
function playerPage(p){let aw=awards[p.player]||[],games=(recentGames[p.player]||recentGames['Trevor Rogers']||[]).slice(0,8),card=p.cardUrl?`<img class="card-img" src="${p.cardUrl}"><a class="download-btn" href="${p.cardUrl}" target="_blank">Download / Open Card</a>`:`<div class="mock-card"><div class="mock-card-head"><div>${p.player}</div><div>Player Card Preview</div></div><div class="mock-card-grid">${[1,2,3,4,5,6].map((x,i)=>`<div class="mock-card-col ${i<3?'left':'right'}"><b>${x}</b><br>2-fly cf<br>3-GB ss X<br>4-strikeout<br>5-WALK<br>6-SINGLE</div>`).join('')}</div></div>`;return `${b('← Back',"setPage('Free Agents')",'back-btn')}<div class="card">${card}</div><div class="card"><h1>${p.player}</h1><p>${p.position||'—'} ${p.hand?'• Bats/Throws '+p.hand:''} • Team ${b(p.team||'FA',`openTeam('${p.team||'FA'}')`)} • Salary ${p.salary||'—'} ${p.injury?'• Injury '+p.injury:''}</p><h2>Stats</h2>${table([{k:'year',l:'Year'},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'g',l:'G'},{k:'avg',l:'AVG'},{k:'hr',l:'HR'},{k:'rbi',l:'RBI'},{k:'ops',l:'OPS'}],[{year:2025,team:p.team||'FA',g:152,avg:'.284',hr:32,rbi:95,ops:'.889'},{year:2024,team:p.team||'FA',g:148,avg:'.271',hr:27,rbi:84,ops:'.841'}])}</div><div class="card"><h2>Awards</h2>${aw.length?table([{k:'season',l:'Season'},{k:'award',l:'Award'},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)}],aw):'<p>No awards listed yet.</p>'}</div><div class="card"><div style="display:flex;justify-content:space-between"><div><h2>Recent Games</h2><p>Defaults to last 8. You can hide/show this section.</p></div>${b(state.showRecent?'Hide':'Show','state.showRecent=!state.showRecent;render()','pill-btn active')}</div>${state.showRecent?table([{k:'date',l:'Date'},{k:'opponent',l:'Opp',r:r=>b(r.opponent,`openTeam('${r.opponent}')`)},{k:'result',l:'Result'},{k:'ip',l:'IP'},{k:'h',l:'H'},{k:'er',l:'ER'},{k:'bb',l:'BB'},{k:'k',l:'K'}],games):''}</div>`}
function teamPage(t){let roster=rosters[t.team]||[];return `${b('← Back',"setPage('Standings')",'back-btn')}<div class="card"><div class="brand-small">Team Page</div><h1>${t.name}</h1><p>${t.team} • ${t.wins}-${t.losses} • ${t.pct}</p></div><div class="grid grid-4"><div class="stat-box"><div class="stat-label">Wins</div><div class="stat-value">${t.wins}</div></div><div class="stat-box"><div class="stat-label">Losses</div><div class="stat-value">${t.losses}</div></div><div class="stat-box"><div class="stat-label">GB</div><div class="stat-value">${t.gb}</div></div><div class="stat-box"><div class="stat-label">Streak</div><div class="stat-value">${t.streak}</div></div></div><div class="grid grid-2" style="margin-top:20px"><div><h2>Roster</h2>${table([{k:'player',l:'Player',r:r=>b(r.player,`openPlayer('${r.player}')`)},{k:'position',l:'Pos'},{k:'salary',l:'Salary'}],roster)}</div><div><h2>Team Stats</h2>${table([{k:'stat',l:'Stat'},{k:'value',l:'Value'},{k:'rank',l:'Rank'}],[{stat:'Runs Scored',value:812,rank:'3rd'},{stat:'Home Runs',value:221,rank:'2nd'},{stat:'Team ERA',value:'3.74',rank:'5th'}])}</div></div>`}
function managerPage(m){return `${b('← Back',"setPage('Managers')",'back-btn')}<div class="card"><div class="brand-small">Manager Page</div><h1>${m.name}</h1><p>Team ${b(m.team,`openTeam('${m.team}')`)} • Career Record ${m.wins}-${m.losses} • ${m.pct}</p></div><div class="grid grid-3"><div class="stat-box"><div class="stat-label">Wins</div><div class="stat-value">${m.wins}</div></div><div class="stat-box"><div class="stat-label">Losses</div><div class="stat-value">${m.losses}</div></div><div class="stat-box"><div class="stat-label">Win %</div><div class="stat-value">${m.pct}</div></div></div><div class="grid grid-2" style="margin-top:20px"><div><h2>Record by Season</h2>${table([{k:'season',l:'Season'},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'wins',l:'W'},{k:'losses',l:'L'},{k:'pct',l:'PCT'},{k:'finish',l:'Finish'}],m.seasons)}</div><div><h2>Awards</h2>${table([{k:'type',l:'Award'},{k:'count',l:'Count'},{k:'years',l:'Years'}],m.awards)}</div></div>`}
function page(){if(state.player)return playerPage(state.player);if(state.team)return teamPage(state.team);if(state.manager)return managerPage(state.manager);if(state.page==='Standings')return head('Standings','Current league standings and playoff positioning.','🏆')+table([{k:'rank',l:'Rank'},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'wins',l:'W'},{k:'losses',l:'L'},{k:'pct',l:'PCT'},{k:'gb',l:'GB'},{k:'streak',l:'Streak'}],teams);if(state.page==='Schedule')return head('Schedule','Upcoming games and league matchups.','📅')+table([{k:'date',l:'Date'},{k:'away',l:'Away',r:r=>b(r.away,`openTeam('${r.away}')`)},{k:'home',l:'Home',r:r=>b(r.home,`openTeam('${r.home}')`)},{k:'time',l:'Time'},{k:'status',l:'Status'}],schedule);if(state.page==='Free Agents'){let filtered=players.filter(p=>(!state.search||p.player.toLowerCase().includes(state.search.toLowerCase()))&&(state.position==='ALL'||p.position===state.position));return head('Free Agents','Available players. Click a player to view card and stats.','➕')+`<div class="controls"><input placeholder="Search players..." value="${state.search}" oninput="state.search=this.value;render()"><select onchange="state.position=this.value;render()">${['ALL','SP','RP','C','1B','2B','3B','SS','OF','LF','CF','RF','DH'].map(x=>`<option ${state.position===x?'selected':''} value="${x}">${x==='ALL'?'All Positions':x}</option>`).join('')}</select></div>`+table([{k:'player',l:'Player',r:r=>b(r.player,`openPlayer('${r.player}')`)},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'position',l:'Position'},{k:'hand',l:'Hand'},{k:'salary',l:'Salary'},{k:'injury',l:'Injury'}],filtered)}if(state.page==='Leaderboards / Stats'){let data=state.stats==='Hitters'?hitterStats:pitcherStats;return head('Leaderboards / Stats','Top league leaders for each hitter and pitcher category.','📊')+`<div class="controls">${['Hitters','Pitchers'].map(x=>b(x,`state.stats='${x}';render()`,'pill-btn '+(state.stats===x?'active':''))).join('')}</div><div class="grid grid-2">${Object.entries(data).map(([cat,rows])=>`<div><h2>${cat} Leaders</h2>${table([{k:'rank',l:'#',r:(r,i)=>i+1},{k:'player',l:'Player',r:r=>b(r[0],`openPlayer('${r[0]}')`)},{k:'team',l:'Team',r:r=>b(r[1],`openTeam('${r[1]}')`)},{k:'value',l:cat,r:r=>r[2]}],rows)}</div>`).join('')}</div>`}if(state.page==='Transactions')return head('Transactions','Recent trades across the league.','🔄')+table([{k:'date',l:'Date'},{k:'teamA',l:'Team',r:r=>b(r.teamA,`openTeam('${r.teamA}')`)},{k:'teamB',l:'Team',r:r=>b(r.teamB,`openTeam('${r.teamB}')`)},{k:'details',l:'Trade Details'}],transactions);if(state.page==='Update Preview')return head('Scorecard Update Preview','Example of what changes after one scorecard is submitted.','✅')+`<div class="card"><div class="brand-small">New Submitted Game</div><h2>${preview.game}</h2><p>${preview.date}</p></div><div class="grid grid-2"><div><h2>Standings Change</h2>${table([{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'before',l:'Before'},{k:'after',l:'After'},{k:'note',l:'Change'}],preview.standings)}</div><div><h2>Hitter Update</h2>${table([{k:'type',l:''},{k:'g',l:'G'},{k:'avg',l:'AVG'},{k:'hr',l:'HR'},{k:'rbi',l:'RBI'},{k:'ops',l:'OPS'}],preview.hitter)}</div><div><h2>Pitcher Update</h2>${table([{k:'type',l:''},{k:'g',l:'G'},{k:'ip',l:'IP'},{k:'era',l:'ERA'},{k:'whip',l:'WHIP'},{k:'k',l:'K'},{k:'w',l:'W'}],preview.pitcher)}</div></div>`;if(state.page==='Managers')return head('Managers','Career manager records. Click a manager to view seasons and awards.','🧢')+table([{k:'name',l:'Manager',r:r=>b(r.name,`openManager('${r.name}')`)},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'wins',l:'W'},{k:'losses',l:'L'},{k:'pct',l:'PCT'}],managers);if(state.page==='Records'){return head('Records','Game records, season records, and career leaders.','📘')+`<div class="controls">${['Game / Season Records','Career Leaders'].map(x=>b(x,`state.records='${x}';render()`,'pill-btn '+(state.records===x?'active':''))).join('')}</div>`+(state.records==='Game / Season Records'?table([{k:'type',l:'Type'},{k:'record',l:'Record'},{k:'holder',l:'Holder',r:r=>b(r.holder,`openPlayer('${r.holder}')`)},{k:'team',l:'Team',r:r=>b(r.team,`openTeam('${r.team}')`)},{k:'value',l:'Value'},{k:'year',l:'Year'}],records):`<div class="controls">${['Hitters','Pitchers'].map(x=>b(x,`state.career='${x}';render()`,'pill-btn '+(state.career===x?'active':''))).join('')}</div><div class="grid grid-2">${Object.entries(career[state.career]).map(([cat,rows])=>`<div><h2>Career ${cat} Leaders</h2>${table([{k:'rank',l:'#',r:(r,i)=>i+1},{k:'player',l:'Player',r:r=>b(r[0],`openPlayer('${r[0]}')`)},{k:'team',l:'Team',r:r=>b(r[1],`openTeam('${r[1]}')`)},{k:'value',l:cat,r:r=>r[2]}],rows)}</div>`).join('')}</div>`)}}
function render(){renderNav();app.innerHTML=page()}render();
</script>
</body>
