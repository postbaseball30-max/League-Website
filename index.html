<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPS League Website</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:18px 24px;position:sticky;top:0;z-index:10}
.header-inner{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.brand-small{font-size:12px;color:#1d4ed8;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.brand-title{font-size:26px;font-weight:900}
nav{display:flex;flex-wrap:wrap;gap:8px}
button,input,select{font-family:inherit}
.nav-btn,.pill-btn,.back-btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.nav-btn{background:#f1f5f9;color:#334155}
.nav-btn.active,.pill-btn.active{background:#1d4ed8;color:#fff}
main{max-width:1280px;margin:auto;padding:28px 24px}
.page-kicker{display:flex;gap:8px;color:#475569;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
h1{font-size:34px;margin:10px 0 4px}
h2{margin:0 0 12px}
.subtitle{color:#64748b;margin-bottom:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:20px}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:850px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:16px;background:#fff;margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#f1f5f9;color:#334155;text-align:left;padding:12px;font-size:13px;white-space:nowrap}
td{border-top:1px solid #f1f5f9;padding:10px 12px;font-size:14px;white-space:nowrap}
.link-btn{border:0;background:transparent;padding:0;color:#1d4ed8;font-weight:800;cursor:pointer;text-decoration:underline}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;font-weight:700}
.stat-box{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px}
.stat-label{color:#64748b;font-size:13px}
.stat-value{font-size:32px;font-weight:900}
.back-btn{background:#fff;border:1px solid #cbd5e1;color:#334155;margin-bottom:16px}
.muted{color:#64748b}.player-card-img{width:100%;max-width:950px;display:block;margin:auto;border:2px solid #0f172a;border-radius:12px}.download-card{display:block;text-align:center;background:#1d4ed8;color:white;text-decoration:none;font-weight:900;border-radius:12px;padding:12px;margin-top:12px}
.loading{padding:24px;text-align:center;color:#64748b}

body.dark{background:#020617;color:#e5e7eb}
body.dark header{background:#0f172a;border-bottom-color:#1e293b}
body.dark .card,body.dark .stat-box,body.dark .table-wrap,body.dark table{background:#0f172a;border-color:#1e293b;color:#e5e7eb}
body.dark th{background:#1e293b;color:#e5e7eb}
body.dark td{border-top-color:#1e293b;color:#e5e7eb}
body.dark .nav-btn{background:#1e293b;color:#cbd5e1}
body.dark .nav-btn.active,body.dark .pill-btn.active{background:#2563eb;color:white}
body.dark input,body.dark select{background:#0f172a;color:#e5e7eb;border-color:#334155}
body.dark .back-btn{background:#0f172a;color:#e5e7eb;border-color:#334155}
body.dark .muted,.dark .subtitle,.dark .stat-label{color:#94a3b8}
.theme-toggle{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
body.dark .theme-toggle{background:#1e293b;color:#e5e7eb;border-color:#334155}
.team-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.team-logo{width:110px;height:110px;object-fit:contain;border-radius:16px;background:white;border:1px solid #e2e8f0;padding:8px}
body.dark .team-logo{background:#f8fafc;border-color:#334155}
@media(max-width:700px){.team-hero{flex-direction:column}.team-logo{width:90px;height:90px}}

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <div class="brand-small">The Bowler's Eye</div>
      <div class="brand-title">OPS League Website <span style="font-size:12px;color:#16a34a;">v10 splits + team stats</span></div>
    </div>
    <button class="theme-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button><nav id="nav"></nav>
  </div>
</header>

<main id="app"><div class="loading">Loading league data...</div></main>

<script>
const SHEET_ID="1Qcm1vlnWojOYEA6s8_tZ1y0IxnFbePE4j8Cy1zkWKeQ";

const TABS={
  standings:"Full Standings",
  league:"League",
  leaders:"Leaders",
  records:"single game records",
  schedule:"Current Schedule",
  fullSeason:"Full Season",
  postseason:"Postseason",
  batters:"Batters",
  pitchers:"Pitcher",
  battingSplits:"Batting Splits",
  pitcherSplits:"Pitcher Splits",
  teams:"Teams"
};

const TEAM_TABS=["CWY","LBS","OVR","OWL","PIT","Pit","RHN","SML","TK","TOR","UCH"];

let db={raw:{},standings:[],leaders:{Hitters:{},Pitchers:{},Fielders:{}},league:{free:[],inj:[],draft:[],dates:[]},rosters:{},players:[],batters:[],pitchers:[],batSplits:[],pitSplits:[],records:[],schedule:[],fullSeason:[],postseason:[],teamStats:[]};

let state={page:"Standings",player:null,team:null,stats:"Hitters",pos:"ALL",search:"",records:"Game / Season Records",career:"Hitters",schedule:"Current Week"};

const tabs=["Standings","Teams","Schedule","Free Agents","Leaderboards / Stats","Records","Postseason","Debug"];

function applyTheme(){
  const mode=localStorage.getItem("opsTheme")||"light";
  document.body.classList.toggle("dark",mode==="dark");
  const btn=document.querySelector(".theme-toggle");
  if(btn)btn.textContent=mode==="dark"?"☀️ Light Mode":"🌙 Dark Mode";
}
function toggleDarkMode(){
  const next=document.body.classList.contains("dark")?"light":"dark";
  localStorage.setItem("opsTheme",next);
  applyTheme();
}


/* ---------- CSV + SHEET ---------- */
function sheetUrl(tab){return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&cachebust=${Date.now()}`}

function parseCSV(text){
  const rows=[]; let row=[],cell="",quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&quote&&n=='"'){cell+='"';i++}
    else if(c=='"'){quote=!quote}
    else if(c==","&&!quote){row.push(cell);cell=""}
    else if((c=="\n"||c=="\r")&&!quote){
      if(c=="\r"&&n=="\n")i++;
      row.push(cell); rows.push(row); row=[]; cell="";
    } else cell+=c;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>(c||"").trim()));
}

async function fetchTab(tab){
  try{
    const res=await fetch(sheetUrl(tab));
    if(!res.ok) throw new Error(`${res.status}`);
    return parseCSV(await res.text());
  }catch(e){
    console.warn("Could not load tab",tab,e);
    return [];
  }
}

function cleanName(v){
  if(!v)return"";
  const s=String(v).trim();
  const m=s.match(/\[([^\]]+)\]/);
  if(m)return m[1].trim();
  return s.replace(/\(https?:\/\/[^)]+\)/g,"").replace(/https?:\/\/\S+/g,"").replace(/\[|\]/g,"").trim();
}

function btn(text,action,cls="link-btn"){return `<button class="${cls}" onclick="${action}">${text||""}</button>`}

function table(cols,rows){
  if(!rows||!rows.length)return `<div class="card muted">No data found.</div>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r,i):(r[c.key]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function head(title,subtitle,icon=""){return `<div class="page-kicker">${icon} League Hub</div><h1>${title}</h1><div class="subtitle">${subtitle}</div>`}

/* ---------- NORMALIZE EXACT SHEET STRUCTURE ---------- */
function normalize(){
  parseStandings();
  parseLeaders();
  parseLeague();
  parseRosters();
  parsePlayers();
  parseSplits();
  parseGenericTabs();
  parseTeamStats();
}

function parseStandings(){
  const rows=db.raw[TABS.standings]||[];
  // Exact uploaded structure:
  // row 1 index 1: Logo, TM, Team, W, L, %, RD, GB, Format, TM, E#, Streak, RS, RA, Run Diff, Pythag, Home, Away, 1 Run, Extras, Last 8, FLAG, gb
  db.standings=rows.slice(2).filter(r=>r[1]&&r[2]).map((r,i)=>({
    rank:i+1,
    logo:r[0],
    tm:r[1],
    team:r[2],
    w:r[3],
    l:r[4],
    pct:r[5],
    rd:r[6],
    gb:r[7],
    format:r[8],
    e:r[10],
    streak:r[11],
    rs:r[12],
    ra:r[13],
    diff:r[14],
    pythag:r[15],
    home:r[16],
    away:r[17],
    oneRun:r[18],
    extras:r[19],
    last8:r[20],
    flag:r[21],
    playoffGb:r[22]
  }));
}

function parseLeaders(){
  const rows=db.raw[TABS.leaders]||[];
  const leaders={Hitters:{},Pitchers:{},Fielders:{}};

  // Leaders CSV layout:
  // row 0 = section titles, row 1 = headers, row 2+ = data.
  // Hitting: category A/r[0], player E/r[4], stat G/r[6] OR F/r[5]
  // Pitching: category I/r[8], player M/r[12], stat O/r[14] OR N/r[13]
  // Fielding: category Q/r[16], player U/r[20], stat W/r[22] OR V/r[21]
  for(let i=2;i<rows.length;i++){
    const r=rows[i]||[];

    const hitCat=(r[0]||"").trim();
    const hitPlayer=cleanName(r[4]);
    const hitStat=((r[6]||"").trim() || (r[5]||"").trim());
    if(hitCat && hitPlayer && hitStat){
      if(!leaders.Hitters[hitCat]) leaders.Hitters[hitCat]=[];
      leaders.Hitters[hitCat].push({player:hitPlayer,value:hitStat});
    }

    const pitCat=(r[8]||"").trim();
    const pitPlayer=cleanName(r[12]);
    const pitStat=((r[14]||"").trim() || (r[13]||"").trim());
    if(pitCat && pitPlayer && pitStat){
      if(!leaders.Pitchers[pitCat]) leaders.Pitchers[pitCat]=[];
      leaders.Pitchers[pitCat].push({player:pitPlayer,value:pitStat});
    }

    const fldCat=(r[16]||"").trim();
    const fldPlayer=cleanName(r[20]);
    const fldStat=((r[22]||"").trim() || (r[21]||"").trim());
    if(fldCat && fldPlayer && fldStat){
      if(!leaders.Fielders[fldCat]) leaders.Fielders[fldCat]=[];
      leaders.Fielders[fldCat].push({player:fldPlayer,value:fldStat});
    }
  }

  db.leaders=leaders;
}

function extractUrl(v){
  if(!v)return"";
  const s=String(v);
  const md=s.match(/\((https?:\/\/[^)]+)\)/);
  if(md)return md[1];
  const raw=s.match(/https?:\/\/\S+/);
  return raw?raw[0].replace(/[)\]]$/,""):"";
}
function parseLeague(){
  const rows=db.raw[TABS.league]||[];
  const out={free:[],inj:[],draft:[],dates:[]};

  rows.slice(2).forEach(r=>{
    // Dates A-D
    if(r[0]&&r[1])out.dates.push({date:r[0],description:r[1],format:r[2],released:r[3]});

    // Free Agents E-H
    if(r[4])out.free.push({player:cleanName(r[4]),cardUrl:extractUrl(r[4]),salary:r[7]||r[5],positions:r[6]});

    // Injured List J-P
    if(r[9])out.inj.push({player:cleanName(r[11]||r[9]),cardUrl:extractUrl(r[9]),team:r[10],effective:r[12],length:r[13],through:r[14],format:r[15]});

    // Draft R-X
    if(r[17]||r[21])out.draft.push({round:r[17],pick:r[18],team:r[19],number:r[20],player:cleanName(r[21]||r[22]),cardUrl:extractUrl(r[22]||r[21]),format:r[23]});
  });

  db.league=out;
}

function parseRosters(){
  db.rosters={};
  db.teamMeta={};
  TEAM_TABS.forEach(tab=>{
    const rows=db.raw[tab]||[];
    const key=String(tab).toUpperCase();
    const roster=[];
    let logoUrl="";

    rows.forEach(r=>{
      if(String(r[0]||"").trim().toLowerCase()==="logo url") logoUrl=r[1]||"";
    });

    db.teamMeta[key]={logoUrl};

    // Exact team tab structure:
    // ROSTER starts at M/T-ish: row 1 index 1 has Status, Team, Player, Salary, Positions, Batter?, Pitcher?, Name
    rows.slice(2).forEach(r=>{
      if(r[12] && r[14]){
        roster.push({
          status:r[12],
          team:r[13]||key,
          player:cleanName(r[19]||r[14]),
          cardUrl:extractUrl(r[14]),
          salary:r[15],
          positions:r[16],
          batter:r[17],
          pitcher:r[18]
        });
      }
    });

    db.rosters[key]=roster.filter(p=>p.player && p.player!=="Player");
  });
}

function parsePlayers(){
  // Batters CSV:
  // Row 0 formulas, row 1 headers, row 2+ data
  const bRows=db.raw[TABS.batters]||[];
  db.batters=bRows.slice(2).filter(r=>r[2]).map(r=>({
    player:cleanName(r[2]),
    cardUrl:extractUrl(r[0]),
    qualified:r[1],
    team:"",
    positions:"BAT",
    PA:r[3], AB:r[4], H:r[5], RBI:r[6], HR:r[7], "3B":r[8], "2B":r[9], "1B":r[10],
    BB:r[11], K:r[12], AVG:r[13], OBP:r[14], SLG:r[15], OPS:r[16],
    HBP:r[17], SAC:r[18], IBB:r[19], DP:r[20], BPHR:r[21], BPFO:r[22], BP1B:r[23], BPLO:r[24], LOB:r[25], R:r[26], SB:r[27], CS:r[28]
  }));

  // Pitchers CSV:
  // Row 0 formulas, row 1 headers, row 2+ data
  const pRows=db.raw[TABS.pitchers]||[];
  db.pitchers=pRows.slice(2).filter(r=>r[3]).map(r=>({
    player:cleanName(r[3]),
    cardUrl:extractUrl(r[0]),
    qualified:r[1],
    team:"",
    positions:r[2]||"P",
    role:r[2]||"P",
    W:r[4], L:r[5], SV:r[6], HD:r[7], BS:r[8], IP:r[9], ERA:r[10], WHIP:r[11],
    HR:r[12], "3B":r[13], "2B":r[14], "1B":r[15], BB:r[16], K:r[17],
    HBP:r[18], IBB:r[19], DP:r[20], BPHR:r[21], BPFO:r[22], BP1B:r[23], BPLO:r[24], LOB:r[25],
    WP:r[26], BK:r[27], R:r[28], ER:r[29], "HR/9":r[30], "BB/9":r[31], "SO/9":r[32], "SO/BB":r[33]
  }));

  db.players=[...db.batters,...db.pitchers,...Object.values(db.rosters).flat(),...db.league.free].reduce((a,p)=>{
    const name=p.player;
    if(name&&!a.find(x=>x.player===name))a.push(p);
    return a;
  },[]);
}

function parseSplits(){
  db.batSplits=parseSplitTab(db.raw[TABS.battingSplits]||[]);
  db.pitSplits=parseSplitTab(db.raw[TABS.pitcherSplits]||[]);
}

function parseSplitTab(rows){
  // Uploaded split CSVs:
  // Row 0 formulas/title, row 1 headers, row 2+ data.
  // Batting Splits headers: Player, Team, name, TM, Split, PA...
  // Pitcher Splits headers: Player, Team, name, TM, Role, Split, BF...
  if(!rows || rows.length<3)return[];
  const headers=rows[1]||[];
  const isPitcher=headers.includes("BF") || headers.includes("Role");

  return rows.slice(2).filter(r=>r[2]).map(r=>{
    if(isPitcher){
      return {
        player:cleanName(r[2]),
        cardUrl:extractUrl(r[0]),
        team:r[3],
        role:r[4],
        split:r[5],
        BF:r[6],
        WHIP:r[7],
        HR:r[8],
        "3B":r[9],
        "2B":r[10],
        "1B":r[11],
        BB:r[12],
        K:r[13],
        AVG:r[14],
        OBP:r[15],
        SLG:r[16],
        OPS:r[17],
        HBP:r[18],
        IBB:r[19],
        DP:r[20],
        BPHR:r[21],
        BPFO:r[22],
        BP1B:r[23],
        BPLO:r[24],
        LOB:r[25],
        "HR/9":r[26],
        "BB/9":r[27],
        "SO/9":r[28],
        "SO/BB":r[29]
      };
    }

    return {
      player:cleanName(r[2]),
      cardUrl:extractUrl(r[0]),
      team:r[3],
      split:r[4],
      PA:r[5],
      AB:r[6],
      H:r[7],
      RBI:r[8],
      HR:r[9],
      "3B":r[10],
      "2B":r[11],
      "1B":r[12],
      BB:r[13],
      K:r[14],
      AVG:r[15],
      OBP:r[16],
      SLG:r[17],
      OPS:r[18],
      HBP:r[19],
      SAC:r[20],
      IBB:r[21],
      DP:r[22],
      BPHR:r[23],
      BPFO:r[24],
      BP1B:r[25],
      BPLO:r[26],
      LOB:r[27]
    };
  }).filter(r=>r.player);
}

function parseTeamStats(){
  const rows=db.raw[TABS.teams]||[];
  // Teams CSV row 1 headers, row 2+ data
  db.teamStats=rows.slice(2).filter(r=>r[1]).map(r=>({
    logo:r[0],
    team:r[1],
    W:r[2],
    L:r[3],
    SV:r[4],
    HD:r[5],
    BS:r[6],
    IP:r[7],
    ERA:r[8],
    WHIP:r[9],
    HR:r[10],
    "3B":r[11],
    "2B":r[12],
    "1B":r[13],
    BB:r[14],
    K:r[15],
    HBP:r[16],
    IBB:r[17],
    DP:r[18],
    BPHR:r[19],
    BPFO:r[20],
    BP1B:r[21],
    BPLO:r[22],
    LOB:r[23],
    WP:r[24],
    BK:r[25],
    R:r[26],
    ER:r[27],
    "HR/9":r[28],
    "BB/9":r[29],
    "SO/9":r[30],
    "SO/BB":r[31]
  }));
}

function toObjects(rows,idx){
  const headers=rows[idx]||[];
  return rows.slice(idx+1).filter(r=>r.some(Boolean)).map(r=>{
    const o={};
    headers.forEach((h,i)=>{if(h)o[h]=r[i]||""});
    return o;
  });
}

function parseGenericTabs(){
  db.schedule=generic(db.raw[TABS.schedule]||[]);
  db.fullSeason=generic(db.raw[TABS.fullSeason]||[]);
  db.records=generic(db.raw[TABS.records]||[]);
  db.postseason=generic(db.raw[TABS.postseason]||[]);
}

function generic(rows){
  const idx=rows.findIndex(r=>r.filter(Boolean).length>=3);
  if(idx<0)return[];
  return toObjects(rows,idx).filter(r=>Object.values(r).some(Boolean)).slice(0,150);
}

/* ---------- LOOKUPS ---------- */
function findPlayer(name){
  const sources=[
    db.batters.find(p=>p.player===name),
    db.pitchers.find(p=>p.player===name),
    Object.values(db.rosters).flat().find(p=>p.player===name),
    db.league.free.find(p=>p.player===name),
    db.league.inj.find(p=>p.player===name),
    db.league.draft.find(p=>p.player===name)
  ].filter(Boolean);

  if(!sources.length) return {player:name,team:"FA",positions:""};
  return sources.reduce((acc,p)=>({...acc,...p}),{});
}

function findTeam(tm){
  return db.standings.find(t=>String(t.tm).toUpperCase()===String(tm).toUpperCase()) || {tm,team:tm,w:"",l:"",pct:""};
}

/* ---------- NAV ---------- */
function setPage(p){state.page=p;state.player=null;state.team=null;render()}
function openPlayer(name){state.player=findPlayer(name);state.team=null;render()}
function openTeam(tm){state.team=findTeam(tm);state.player=null;render()}

function renderNav(){
  document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="nav-btn ${state.page===t&&!state.player&&!state.team?"active":""}" onclick="setPage('${t}')">${t}</button>`).join("");
}

/* ---------- PAGES ---------- */
function renderPlayerPage(p){
  const hitter=db.batters.find(x=>x.player===p.player);
  const pitcher=db.pitchers.find(x=>x.player===p.player);
  const stat=hitter||pitcher||p;
  const isPitcher=!!pitcher&&!hitter;

  const splits=(isPitcher?db.pitSplits:db.batSplits).filter(x=>x.player===p.player);
  if(!stat.team && splits.length) stat.team=splits[0].team;

  const cardUrl=stat.cardUrl||p.cardUrl||(splits[0]&&splits[0].cardUrl)||"";
  const cardHtml=cardUrl
    ? `<div class="card"><img class="player-card-img" src="${cardUrl}" alt="${p.player} card"><a class="download-card" href="${cardUrl}" target="_blank">Open / Download Card</a></div>`
    : `<div class="card muted">No player card linked yet.</div>`;

  const seasonCols=isPitcher
    ? [
      {key:"qualified",label:"Qualified"},{key:"positions",label:"Role"},{key:"W",label:"W"},{key:"L",label:"L"},{key:"SV",label:"SV"},{key:"HD",label:"HD"},{key:"BS",label:"BS"},
      {key:"IP",label:"IP"},{key:"ERA",label:"ERA"},{key:"WHIP",label:"WHIP"},{key:"HR",label:"HR"},{key:"BB",label:"BB"},{key:"K",label:"K"},{key:"R",label:"R"},{key:"ER",label:"ER"},
      {key:"HR/9",label:"HR/9"},{key:"BB/9",label:"BB/9"},{key:"SO/9",label:"SO/9"},{key:"SO/BB",label:"SO/BB"}
    ]
    : [
      {key:"qualified",label:"Qualified"},{key:"PA",label:"PA"},{key:"AB",label:"AB"},{key:"H",label:"H"},{key:"RBI",label:"RBI"},{key:"HR",label:"HR"},
      {key:"3B",label:"3B"},{key:"2B",label:"2B"},{key:"1B",label:"1B"},{key:"BB",label:"BB"},{key:"K",label:"K"},{key:"AVG",label:"AVG"},{key:"OBP",label:"OBP"},
      {key:"SLG",label:"SLG"},{key:"OPS",label:"OPS"},{key:"HBP",label:"HBP"},{key:"SAC",label:"SAC"},{key:"IBB",label:"IBB"},{key:"DP",label:"DP"},{key:"LOB",label:"LOB"},
      {key:"R",label:"R"},{key:"SB",label:"SB"},{key:"CS",label:"CS"}
    ];

  const splitCols=isPitcher
    ? ["split","team","role","BF","WHIP","HR","3B","2B","1B","BB","K","AVG","OBP","SLG","OPS","HR/9","BB/9","SO/9","SO/BB"].map(k=>({key:k,label:k}))
    : ["split","team","PA","AB","H","RBI","HR","3B","2B","1B","BB","K","AVG","OBP","SLG","OPS","HBP","SAC","IBB","DP","LOB"].map(k=>({key:k,label:k}));

  return `${btn("← Back","setPage('Free Agents')","back-btn")}
    ${cardHtml}
    <div class="card">
      <h1>${p.player}</h1>
      <p class="muted">${stat.positions||stat.role||""} ${stat.team?`• Team ${btn(stat.team,`openTeam('${stat.team}')`)}`:""}</p>
      <h2>Season Stats</h2>
      ${table(seasonCols,[stat])}
    </div>
    <div class="card"><h2>${isPitcher ? "Pitching Splits" : "Batting Splits"}</h2>${splits.length ? table(splitCols,splits) : `<p class="muted">No split rows found for this player yet.</p>`}</div>`;
}

function renderTeamPage(t){
  const roster=db.rosters[String(t.tm).toUpperCase()]||[];
  const logo=t.logo || ((db.teamMeta&&db.teamMeta[String(t.tm).toUpperCase()]&&db.teamMeta[String(t.tm).toUpperCase()].logoUrl)||"");
  return `${btn("← Back","setPage('Teams')","back-btn")}
    <div class="card team-hero"><div><h1>${t.team}</h1><p class="muted">${t.tm} • ${t.w}-${t.l} • ${t.pct}</p></div>${logo?`<img class="team-logo" src="${logo}" alt="${t.team} logo">`:""}</div>
    <div class="grid grid-4">
      <div class="stat-box"><div class="stat-label">Wins</div><div class="stat-value">${t.w||"-"}</div></div>
      <div class="stat-box"><div class="stat-label">Losses</div><div class="stat-value">${t.l||"-"}</div></div>
      <div class="stat-box"><div class="stat-label">GB</div><div class="stat-value">${t.gb||"-"}</div></div>
      <div class="stat-box"><div class="stat-label">Streak</div><div class="stat-value">${t.streak||"-"}</div></div>
    </div>
    <h2>Team Pitching Totals</h2>
    ${table([
      {key:"W",label:"W"},{key:"L",label:"L"},{key:"SV",label:"SV"},{key:"HD",label:"HD"},{key:"BS",label:"BS"},{key:"IP",label:"IP"},{key:"ERA",label:"ERA"},{key:"WHIP",label:"WHIP"},
      {key:"HR",label:"HR"},{key:"BB",label:"BB"},{key:"K",label:"K"},{key:"R",label:"R"},{key:"ER",label:"ER"},{key:"HR/9",label:"HR/9"},{key:"BB/9",label:"BB/9"},{key:"SO/9",label:"SO/9"},{key:"SO/BB",label:"SO/BB"}
    ], db.teamStats.filter(x=>String(x.team).toUpperCase()===String(t.tm).toUpperCase()))}
    <h2>Roster</h2>
    ${table([
      {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
      {key:"status",label:"Status"},
      {key:"positions",label:"Positions"},
      {key:"salary",label:"Salary"},
      {key:"batter",label:"Batter?"},
      {key:"pitcher",label:"Pitcher?"}
    ],roster)}`;
}

function renderPage(){
  if(state.player)return renderPlayerPage(state.player);
  if(state.team)return renderTeamPage(state.team);

  if(state.page==="Standings"){
    return head("Standings","Live standings from Full Standings tab.","🏆")+table([
      {key:"rank",label:"Rank"},
      {key:"tm",label:"TM",render:r=>btn(r.tm,`openTeam('${r.tm}')`)},
      {key:"team",label:"Team"},
      {key:"w",label:"W"},
      {key:"l",label:"L"},
      {key:"pct",label:"%"},
      {key:"rd",label:"RD"},
      {key:"gb",label:"GB"},
      {key:"streak",label:"Streak"},
      {key:"rs",label:"RS"},
      {key:"ra",label:"RA"},
      {key:"diff",label:"Run Diff"},
      {key:"pythag",label:"Pythag"},
      {key:"home",label:"Home"},
      {key:"away",label:"Away"},
      {key:"last8",label:"Last 8"}
    ],db.standings);
  }

  if(state.page==="Teams"){
    return head("Teams","Click a team to view roster.","⚾")+table([
      {key:"tm",label:"TM",render:r=>btn(r.tm,`openTeam('${r.tm}')`)},
      {key:"team",label:"Team"},
      {key:"w",label:"W"},
      {key:"l",label:"L"},
      {key:"pct",label:"%"},
      {key:"gb",label:"GB"},
      {key:"streak",label:"Streak"}
    ],db.standings);
  }

  if(state.page==="Schedule"){
    const rows=state.schedule==="Current Week"?db.schedule:db.fullSeason;
    return head("Schedule","Current week or full season schedule.","📅")+`<div class="controls">${["Current Week","Full Season"].map(x=>btn(x,`state.schedule='${x}';render()`,"pill-btn "+(state.schedule===x?"active":""))).join("")}</div>`+table(Object.keys(rows[0]||{}).map(k=>({key:k,label:k})),rows);
  }

  if(state.page==="Free Agents"){
    const rows=db.league.free.filter(p=>(!state.search||p.player.toLowerCase().includes(state.search.toLowerCase()))&&(state.pos==="ALL"||(p.positions||"").includes(state.pos)));
    return head("Free Agents","Free agents, injured list, and draft results from League tab.","➕")+`
      <div class="controls"><input placeholder="Search players..." value="${state.search}" oninput="state.search=this.value;render()">
      <select onchange="state.pos=this.value;render()">${["ALL","SP","RP","C","1B","2B","3B","SS","OF","LF","CF","RF","DH"].map(x=>`<option ${state.pos===x?"selected":""} value="${x}">${x}</option>`).join("")}</select></div>
      <h2>Free Agents</h2>
      ${table([
        {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
        {key:"positions",label:"Positions"},
        {key:"salary",label:"Salary"}
      ],rows)}
      <h2>Injured List</h2>
      ${table([
        {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
        {key:"team",label:"Team",render:r=>btn(r.team,`openTeam('${r.team}')`)},
        {key:"effective",label:"Effective"},
        {key:"length",label:"Length"},
        {key:"through",label:"Through"},
        {key:"format",label:"Format"}
      ],db.league.inj)}
      <h2>Draft Results</h2>
      ${table([
        {key:"round",label:"Round"},
        {key:"pick",label:"Pick"},
        {key:"team",label:"Team",render:r=>btn(r.team,`openTeam('${r.team}')`)},
        {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
        {key:"format",label:"Format"}
      ],db.league.draft)}`;
  }

  if(state.page==="Leaderboards / Stats"){
    const data=state.stats==="Hitters"?db.leaders.Hitters:state.stats==="Pitchers"?db.leaders.Pitchers:db.leaders.Fielders;
    return head("Leaderboards / Stats","v10: Player stats, splits, team totals, and fixed leader parsing.","📊")+`
      <div class="controls">${["Hitters","Pitchers","Fielders"].map(x=>btn(x,`state.stats='${x}';render()`,"pill-btn "+(state.stats===x?"active":""))).join("")}</div>
      <div class="grid grid-2">${Object.entries(data).map(([cat,rows])=>`
        <div><h2>${cat}</h2>${table([
          {key:"rank",label:"#",render:(r,i)=>i+1},
          {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
          {key:"value",label:"Stat"}
        ],rows.slice(0,5))}</div>`).join("")}</div>`;
  }

  if(state.page==="Records"){
    return head("Records","Single game records and career leaders.","📘")+`
      <div class="controls">${["Game / Season Records","Career Leaders"].map(x=>btn(x,`state.records='${x}';render()`,"pill-btn "+(state.records===x?"active":""))).join("")}${state.records==="Career Leaders"?["Hitters","Pitchers"].map(x=>btn(x,`state.career='${x}';render()`,"pill-btn "+(state.career===x?"active":""))).join(""):""}</div>
      ${state.records==="Game / Season Records"
        ? table(Object.keys(db.records[0]||{}).slice(0,12).map(k=>({key:k,label:k})),db.records.slice(0,80))
        : careerLeaders()
      }`;
  }

  if(state.page==="Postseason"){
    return head("Postseason","Postseason results.","🏆")+table(Object.keys(db.postseason[0]||{}).map(k=>({key:k,label:k})),db.postseason);
  }

  if(state.page==="Debug"){
    const d=db.leaderDebug||{};
    const raw3=d.rawRow3||[];
    const raw4=d.rawRow4||[];
    const first=d.firstParsed||{};
    const logoRows=db.standings.map(t=>({tm:t.tm,team:t.team,logo:t.logo}));
    return head("Debug","Use this to verify what the live site is reading from Google Sheets.","🛠️")+
      `<div class="card"><h2>First Parsed Leaders</h2>
        <p><b>Hitter:</b> ${first.hitter?first.hitter.player+" - "+first.hitter.value:"none"}</p>
        <p><b>Pitcher:</b> ${first.pitcher?first.pitcher.player+" - "+first.pitcher.value:"none"}</p>
        <p><b>Fielder:</b> ${first.fielder?first.fielder.player+" - "+first.fielder.value:"none"}</p>
      </div>`+
      `<div class="card"><h2>Raw Leaders Row 3</h2><pre style="white-space:pre-wrap;overflow:auto;">${JSON.stringify(raw3,null,2)}</pre></div>`+
      `<div class="card"><h2>Raw Leaders Row 4</h2><pre style="white-space:pre-wrap;overflow:auto;">${JSON.stringify(raw4,null,2)}</pre></div>`+
      `<div class="card"><h2>Team Logo URLs From Standings</h2>${table([{key:"tm",label:"TM"},{key:"team",label:"Team"},{key:"logo",label:"Logo URL"}],logoRows)}</div>`;
  }

  return "";
}

function careerLeaders(){
  const isHit=state.career==="Hitters";
  const source=isHit?db.batters:db.pitchers;
  const groups=isHit?{
    HR:[...source].sort((a,b)=>Number(b.HR||0)-Number(a.HR||0)).slice(0,10),
    RBI:[...source].sort((a,b)=>Number(b.RBI||0)-Number(a.RBI||0)).slice(0,10),
    OPS:[...source].sort((a,b)=>Number(b.OPS||0)-Number(a.OPS||0)).slice(0,10)
  }:{
    W:[...source].sort((a,b)=>Number(b.W||0)-Number(a.W||0)).slice(0,10),
    K:[...source].sort((a,b)=>Number(b.K||0)-Number(a.K||0)).slice(0,10),
    ERA:[...source].filter(x=>x.ERA).sort((a,b)=>Number(a.ERA||999)-Number(b.ERA||999)).slice(0,10)
  };
  return `<div class="grid grid-2">${Object.entries(groups).map(([cat,rows])=>`<div><h2>Career ${cat}</h2>${table([
    {key:"rank",label:"#",render:(r,i)=>i+1},
    {key:"player",label:"Player",render:r=>btn(r.player,`openPlayer('${String(r.player).replace(/'/g,"\\'")}')`)},
    {key:"team",label:"Team",render:r=>r.team?btn(r.team,`openTeam('${r.team}')`):""},
    {key:cat,label:cat,render:r=>r[cat]}
  ],rows)}</div>`).join("")}</div>`;
}

function render(){
  renderNav();
  document.getElementById("app").innerHTML=renderPage();
}

async function init(){applyTheme();
  renderNav();
  document.getElementById("app").innerHTML=`<div class="loading">Loading league data from Google Sheets...</div>`;
  const allTabs=[...Object.values(TABS),...TEAM_TABS];
  await Promise.all(allTabs.map(async tab=>db.raw[tab]=await fetchTab(tab)));
  normalize();
  render();
}
init();
</script>
</body>
</html>
